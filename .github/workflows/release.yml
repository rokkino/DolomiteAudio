name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (release)
        shell: pwsh
        run: |
          cargo build --release -p audio-asio
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release -p audio-control -p audio-bench
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path target\release\audio_asio.dll)) { Copy-Item target\release\deps\audio_asio.dll target\release\ }
          Get-ChildItem target\release\*.dll, target\release\*.exe

      - name: Unit tests (resampler)
        run: cargo test --release -p audio-core stream_resampler

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if ($ver -notmatch '^v\d') { $ver = "v2.0.0-dev" }
          $ver = $ver.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item target\release\audio_asio.dll, target\release\audio-control.exe, target\release\asio_selftest.exe, register_driver.ps1, README.md portable\
          Compress-Archive -Path portable\* -DestinationPath "dist\DolomiteAudioRT-$ver-portable.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: DolomiteAudioRT
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          make_latest: true
